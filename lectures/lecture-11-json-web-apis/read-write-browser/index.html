<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON File System Access Demo</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 2rem;
        max-width: 600px;
      }
      button {
        padding: 8px 16px;
        margin-right: 8px;
        cursor: pointer;
      }
      textarea {
        width: 100%;
        height: 200px;
        margin-top: 1rem;
        font-family: monospace;
      }
      .status {
        margin-top: 1rem;
        font-weight: bold;
        color: #2e7d32;
      }
    </style>
  </head>
  <body>
    <h2>File System Access API (JSON Read/Write)</h2>

    <button id="btnOpen">1. Open JSON File</button>
    <button id="btnSave">2. Save / Overwrite File</button>
    <button id="btnSaveAs">3. Save As New File</button>

    <textarea
      id="jsonEditor"
      placeholder="Open a file or write JSON here..."
    ></textarea>
    <div id="status" class="status"></div>

    <script src="app.js"></script>
  </body>
</html>
