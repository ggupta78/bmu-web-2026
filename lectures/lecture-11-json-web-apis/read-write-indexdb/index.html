<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IndexedDB JSON CRUD Demo</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 2rem;
        max-width: 700px;
      }
      form {
        background: #f4f4f4;
        padding: 1rem;
        border-radius: 6px;
        margin-bottom: 1.5rem;
      }
      .field {
        margin-bottom: 0.8rem;
      }
      label {
        display: block;
        font-weight: bold;
        margin-bottom: 0.2rem;
      }
      input[type="text"],
      input[type="email"] {
        width: 100%;
        padding: 6px;
        box-sizing: border-box;
      }
      button {
        padding: 6px 12px;
        cursor: pointer;
        margin-right: 4px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 8px;
        text-align: left;
      }
      th {
        background: #eee;
      }
      .actions {
        white-space: nowrap;
      }
      .error {
        color: #d32f2f;
        font-weight: bold;
        margin-top: 0.5rem;
      }
    </style>
  </head>
  <body>
    <h2>IndexedDB JSON Management (Create, Read, Update, Delete)</h2>

    <!-- FORM FOR ADDING / EDITING DATA -->
    <form id="userForm">
      <input type="hidden" id="userId" />
      <!-- Holds numeric primary key when editing -->

      <div class="field">
        <label for="userName">Name:</label>
        <input type="text" id="userName" required />
      </div>

      <div class="field">
        <label for="userEmail">Email:</label>
        <input type="email" id="userEmail" required />
      </div>

      <div class="field">
        <label for="userRole">Role:</label>
        <input
          type="text"
          id="userRole"
          required
          placeholder="e.g. Developer, Admin"
        />
      </div>

      <button type="submit" id="btnSubmit">Add User</button>
      <button type="button" id="btnCancel" style="display: none">
        Cancel Edit
      </button>
      <div id="errorMessage" class="error"></div>
    </form>

    <!-- TABLE TO DISPLAY STORED JSON OBJECTS -->
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>

    <script src="app.js"></script>
  </body>
</html>
