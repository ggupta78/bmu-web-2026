<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple JSONPlaceholder API Example</title>
  </head>
  <body>
    <h1>JSONPlaceholder REST API Demo</h1>

    <!-- Action Buttons -->
    <button onclick="getAllPosts()">GET All Posts</button>
    <button onclick="getPost()">GET Post #1</button>
    <button onclick="createPost()">POST New Post</button>
    <button onclick="updatePost()">PUT (Update) Post #1</button>
    <button onclick="deletePost()">DELETE Post #1</button>

    <h3>API Output:</h3>
    <pre id="output">Click a button above to run an API request...</pre>

    <script src="app.js"></script>
  </body>
</html>
